name: feed

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths-ignore: [feed.xml, diag.log]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar feed
        id: gen
        continue-on-error: true
        run: |
          python3 blogger_comments.py https://eurogenes.blogspot.com --blog -n 300 --feed --merge-from feed.xml --verbose > feed.new 2> gen.log
          test -s feed.new

      - name: Diagnostico
        if: steps.gen.outcome == 'failure'
        run: |
          {
            echo "== data"; date -u
            echo "== feed JSON"
            curl -sS -o /tmp/probe.json -w "http=%{http_code} bytes=%{size_download}\n" \
              "https://eurogenes.blogspot.com/feeds/comments/default?alt=json&max-results=1" || true
            head -c 200 /tmp/probe.json || true
            echo
            echo "== pagina do post"
            curl -sS -o /dev/null -w "http=%{http_code} bytes=%{size_download}\n" \
              "https://eurogenes.blogspot.com/2026/07/the-g25-proto-indo-european-master-sheet.html" || true
            echo "== script stderr"
            cat gen.log
          } > diag.log
          git checkout -B diag
          git add -f diag.log
          git -c user.name=feedbot -c user.email=feedbot@users.noreply.github.com commit -q -m "diag $(date -u +%FT%TZ)"
          git push -f origin diag

      - name: Publicar se houve comentarios novos
        if: steps.gen.outcome == 'success'
        run: |
          git config user.name "feedbot"
          git config user.email "feedbot@users.noreply.github.com"
          git add feed.xml
          if git diff --cached --quiet; then
            echo "sem alteracoes"
          else
            git commit -m "feed: $(date -u +%FT%TZ)"
            git push
          fi
