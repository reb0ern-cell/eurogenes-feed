name: feed

on:
  schedule:
    # 3x por dia, de 8 em 8 horas (minuto 17 para evitar as horas de ponta)
    - cron: "17 0,8,16 * * *"
  push:
    branches: [main]
    paths-ignore: [feed.xml, diag.log]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar feed
        id: gen
        continue-on-error: true
        run: |
          python3 blogger_comments.py https://eurogenes.blogspot.com --blog -n 300 --feed --merge-from feed.xml --verbose > feed.new 2> gen.log
          test -s feed.new

      - name: Diagnostico se falhar
        if: steps.gen.outcome == 'failure'
        run: |
          {
            echo "== data"; date -u
            echo "== feed JSON"
            curl -sS -o /dev/null -w "http=%{http_code}\n" \
              "https://eurogenes.blogspot.com/feeds/comments/default?alt=json&max-results=1" || true
            echo "== pagina do post"
            curl -sS -o /dev/null -w "http=%{http_code}\n" \
              "https://eurogenes.blogspot.com/2026/07/the-g25-proto-indo-european-master-sheet.html" || true
            echo "== script stderr"
            cat gen.log
          } > diag.log
          mkdir -p /tmp/diag && cd /tmp/diag
          cp "$GITHUB_WORKSPACE/diag.log" .
          git init -q
          git add diag.log
          git -c user.name=feedbot -c user.email=feedbot@users.noreply.github.com commit -q -m "diag $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:diag

      - name: Publicar se houve comentarios novos
        if: steps.gen.outcome == 'success'
        run: |
          git config user.name "feedbot"
          git config user.email "feedbot@users.noreply.github.com"
          git add feed.xml
          if git diff --cached --quiet; then
            echo "sem alteracoes"
          else
            git commit -m "feed: $(date -u +%FT%TZ)"
            git push
          fi
