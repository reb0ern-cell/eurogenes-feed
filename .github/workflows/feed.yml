name: feed

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar feed
        run: |
          python3 blogger_comments.py https://eurogenes.blogspot.com --blog -n 300 --feed --merge-from feed.xml --verbose > feed.new
          test -s feed.new
          mv feed.new feed.xml

      - name: Publicar se houve comentarios novos
        run: |
          git config user.name "feedbot"
          git config user.email "feedbot@users.noreply.github.com"
          git add feed.xml
          if git diff --cached --quiet; then
            echo "sem alteracoes"
          else
            git commit -m "feed: $(date -u +%FT%TZ)"
            git push
          fi
